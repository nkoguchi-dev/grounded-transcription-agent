name: grounded-transcription-agent

services:
  postgres:
    image: postgres:17
    env_file: ./backend/.env.local
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["./database/data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    env_file: ./minio/.env.local
    environment:
      MINIO_REGION: ap-northeast-1
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9002:9000", "127.0.0.1:9003:9001"]
    volumes: ["./minio/volume:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    env_file: ./minio/.env.local
    volumes: ["./minio/init.sh:/usr/local/bin/init.sh:ro"]
    entrypoint: ["/bin/sh", "/usr/local/bin/init.sh"]

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: ./backend/.env.local
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["127.0.0.1:8010:8000"]
    volumes: ["./backend:/app"]
    env_file: ./backend/.env.local
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: ./backend
    command: ["celery", "-A", "app.celery_app.celery", "worker", "--loglevel=INFO"]
    volumes: ["./backend:/app"]
    env_file: ./backend/.env.local
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
